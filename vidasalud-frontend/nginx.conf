# HTTP: reto ACME de Let's Encrypt + redirección a HTTPS
server {
    listen 80;
    server_name vidasalud.duckdns.org _;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: SPA + proxy /api hacia el BFF
server {
    listen 443 ssl;
    http2 on;
    server_name vidasalud.duckdns.org _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy del frontend hacia el BFF (misma ruta /api/...).
    # En AWS es el destino de la integración del API Gateway hacia la EC2.
    location /api/ {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: siempre sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}