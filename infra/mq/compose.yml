version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: vidasalud-rabbitmq
    ports:
      - "5672:5672"   # Puerto AMQP para conectar Spring Boot
      - "15672:15672" # Interfaz web de control
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest