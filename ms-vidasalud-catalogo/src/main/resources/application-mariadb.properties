# ── MariaDB (perfil 'mariadb') ──────────────────────────────
# Se activa en el deploy de AWS con SPRING_PROFILES_ACTIVE=mariadb.
# Los values por env permiten sobrescribir sin editar este archivo.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://catalogdb:3306/catalogo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vidasalud}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vidasalud}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Dialecto explícito (el perfil base apunta a H2Dialect).
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Esquema: Hibernate crea/actualiza las tablas desde las entidades.
spring.jpa.hibernate.ddl-auto=update

# Seeds idempotentes (solo si la tabla está vacía / INSERT IGNORE).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data-mariadb.sql

# La consola H2 no aplica con MariaDB.
spring.h2.console.enabled=false