server.port=8080
spring.application.name=ms-vidasalud-bff

# ── Microservicios de destino (proxy) ──────────────────────
bff.catalogo.base-url=http://localhost:8081
bff.atenciones.base-url=http://localhost:8082

# ── CORS: orígenes permitidos para el frontend (coma) ─────
bff.cors.allowed-origins=http://localhost:5173

# ── Azure AD / Entra ID ────────────────────────────────────
azure.issuer-uri=https://login.microsoftonline.com/a02c872a-3746-4efc-a2e3-1f8e608b99e4/v2.0
azure.jwk-set-uri=https://login.microsoftonline.com/a02c872a-3746-4efc-a2e3-1f8e608b99e4/discovery/v2.0/keys
# Audiencias aceptadas (compáralas por coma). Azure AD v2.0 emite el access
# token con aud = Application ID (GUID) de la API; se aceptan también las dos
# formas por si algún flujo devuelve la Application ID URI (api://...).
azure.audience=6db95f4d-96a5-47ca-bc8e-e43bd5eda9ab,api://6db95f4d-96a5-47ca-bc8e-e43bd5eda9ab

# ── Swagger / OpenAPI ──────────────────────────────────────
springdoc.packages-to-scan=com.vidasalud