spring:
  application:
    name: ms-vidasalud-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual          # el listener es el único que hace ack/nack
        default-requeue-rejected: false   # si algo falla, va a la DLQ en vez de reintentar en bucle